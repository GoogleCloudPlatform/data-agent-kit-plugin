name: Lint Markdown

on:
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    name: Run link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # There is no security token. So, it would fail on any links which aren't public.
          #
          # The google-cloud-storage-* and bigtable-basics skill docs contain
          # illustrative command examples (gcloud/curl/apt/REST) with placeholder
          # buckets, endpoints, versions, and accounts. Additionally, external CI
          # runner IPs hitting Google Cloud documentation links trigger Google
          # anti-abuse rate limits. Exclude GCS partner skill paths and bigtable-basics
          # from the link checker.
          args: "--verbose --no-progress --exclude-path skills/google-cloud-storage-basics --exclude-path skills/google-cloud-storage-fuse --exclude-path skills/google-cloud-storage-bucket-architect --exclude-path skills/bigtable-basics --exclude-path skills/bigtable_basics **/*.md"
