name: Lint Markdown

on:
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    name: Run link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Link Checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # There is no security token. So, it would fail on any links which aren't public.
          #
          # The google-cloud-storage-*, bigtable-basics, bigquery-*, and gcp-spark-observability skill docs
          # contain illustrative command examples and Console URLs with placeholder
          # buckets, projects, regions, endpoints, versions, and accounts. Additionally,
          # external CI runner IPs hitting Google Cloud documentation links trigger
          # Google anti-abuse rate limits. Exclude these partner skill paths from the
          # link checker.
          args: "--verbose --no-progress --exclude-path skills/google-cloud-storage-basics --exclude-path skills/google-cloud-storage-fuse --exclude-path skills/google-cloud-storage-bucket-architect --exclude-path skills/bigtable-basics --exclude-path skills/bigtable_basics --exclude-path skills/bigquery-observability --exclude-path skills/bigquery-optimization --exclude-path skills/bigquery-troubleshooting --exclude-path skills/gcp-spark-observability --exclude-path skills/gcp_spark_observability **/*.md"
